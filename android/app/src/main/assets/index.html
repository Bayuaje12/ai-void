<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08070d"><title>X-VOID AI</title>
<style>
:root{color-scheme:dark;--line:#282236}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 32%,#24123a 0%,#0d0a16 38%,#08070d 75%);color:#f5f1ff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100vh;padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center}.brand{width:100%;display:flex;justify-content:space-between;font-size:12px;letter-spacing:3px;color:#c9b8e8}.brand b{color:white;font-size:16px}.tag{margin-top:6px;font-size:10px;color:#80768f;letter-spacing:2px}.orb-wrap{flex:1;min-height:290px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px}.orb{width:190px;height:190px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#f0d7ff 0%,#b66cff 13%,#6825a2 35%,#210d39 65%,#090710 78%);box-shadow:0 0 35px #9b4bdb77,0 0 100px #7c3aed44,inset -15px -20px 38px #05030a}.orb:before{content:'';position:absolute;inset:-13px;border-radius:50%;border:1px solid #c084fc55;animation:pulse 3s infinite}.orb.active{animation:breathe 1.2s infinite;box-shadow:0 0 55px #c084fcaa,0 0 130px #9333ea77}@keyframes pulse{50%{transform:scale(1.08);opacity:.35}}@keyframes breathe{50%{transform:scale(1.035)}}.status{font-size:13px;color:#c4b8d4;letter-spacing:1px}.status strong{color:#e9d5ff}.transcript{width:100%;max-height:180px;overflow:auto;background:#100d18aa;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:18px;font-size:13px;line-height:1.5}.line{margin:7px 0;color:#d9d2e5}.line b{color:#c084fc}.hint{color:#756c84;text-align:center;font-size:12px}.controls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{font:inherit;border-radius:14px;border:1px solid var(--line);padding:14px;background:#171321;color:white}button{font-weight:700;letter-spacing:1px}button:disabled{opacity:.45}.primary{background:linear-gradient(135deg,#9333ea,#5b21b6);border:0}.danger{background:#21111b;color:#fda4af;border-color:#542333}.server{width:100%;margin:18px 0 10px}.server label{display:block;color:#a69bb5;font-size:11px;margin-bottom:7px;letter-spacing:1px}.server input{width:100%;font-size:13px}.foot{margin-top:auto;padding-top:20px;color:#635b70;font-size:10px;letter-spacing:1px;text-align:center}
</style></head><body><main class="app">
<header class="brand"><b>X-VOID</b><span>VOICE INTELLIGENCE</span></header><div class="tag">SHE DOESN'T PLAY NICE.</div>
<section class="orb-wrap"><div id="orb" class="orb"></div><div id="status" class="status">STATUS: <strong>OFFLINE</strong></div><div class="hint">Hubungkan lalu bicara. X-VOID akan mendengarkan.</div></section>
<section id="transcript" class="transcript"><div class="hint">Percakapan akan muncul di sini.</div></section>
<div class="controls"><button id="connect" class="primary">CONNECT</button><button id="disconnect" class="danger" disabled>DISCONNECT</button></div>
<div class="server"><label for="serverUrl">BACKEND URL</label><input id="serverUrl" value="http://10.0.2.2:3000" autocomplete="url" spellcheck="false"></div><div class="foot">X-VOID AI • REALTIME SPEECH • KEEP IT DIRECT</div>
</main><script>
const $=id=>document.getElementById(id);let pc=null,dc=null,stream=null,audio=null;
const status=(s,on=false)=>{$('status').innerHTML='STATUS: <strong>'+s+'</strong>';$('orb').classList.toggle('active',on)};
function line(who,text){const box=$('transcript');if(box.querySelector('.hint'))box.innerHTML='';const row=document.createElement('div');row.className='line';const b=document.createElement('b');b.textContent=who+': ';row.append(b,document.createTextNode(text));box.append(row);box.scrollTop=box.scrollHeight}
function cleanup(){if(dc){try{dc.close()}catch{}dc=null}if(pc){try{pc.close()}catch{}pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audio){audio.srcObject=null;audio.remove();audio=null}$('disconnect').disabled=true;$('connect').disabled=false;status('OFFLINE')}
async function connect(){$('connect').disabled=true;status('CONNECTING...');try{
const backend=$('serverUrl').value.trim().replace(/\/+$/,'');if(!backend)throw Error('Isi Backend URL.');localStorage.setItem('xvoid_backend',backend);
const tr=await fetch(backend+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const td=await tr.json();if(!tr.ok)throw Error(td.error||'Gagal mengambil token.');
pc=new RTCPeerConnection();audio=document.createElement('audio');audio.autoplay=true;audio.playsInline=true;audio.style.display='none';document.body.append(audio);pc.ontrack=e=>{audio.srcObject=e.streams[0];audio.play().catch(()=>{})};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected')status('LISTENING',true);if(['failed','disconnected','closed'].includes(pc?.connectionState))status('DISCONNECTED')};
stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});stream.getTracks().forEach(t=>pc.addTrack(t,stream));
dc=pc.createDataChannel('oai-events');dc.onopen=()=>{status('LISTENING',true);$('disconnect').disabled=false};dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='input_audio_buffer.speech_started')status('HEARING YOU',true);if(m.type==='input_audio_buffer.speech_stopped')status('THINKING',true);if(m.type==='response.created')status('SPEAKING',true);if(m.type==='response.done')status('LISTENING',true);if(m.type==='conversation.item.input_audio_transcription.completed'&&m.transcript)line('YOU',m.transcript);if(m.type==='response.output_audio_transcript.delta'&&m.delta)line('X-VOID',m.delta);if(m.type==='error')line('ERROR',m.error?.message||'Realtime error')};
const offer=await pc.createOffer();await pc.setLocalDescription(offer);const sr=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:offer.sdp,headers:{Authorization:'Bearer '+td.value,'Content-Type':'application/sdp'}});if(!sr.ok)throw Error('Realtime connect gagal ('+sr.status+'): '+(await sr.text()).slice(0,250));await pc.setRemoteDescription({type:'answer',sdp:await sr.text()});$('disconnect').disabled=false;
}catch(e){line('SYSTEM',e.message||String(e));status('ERROR');cleanup()}finally{$('connect').disabled=false}}
$('connect').addEventListener('click',connect);$('disconnect').addEventListener('click',cleanup);const saved=localStorage.getItem('xvoid_backend');if(saved)$('serverUrl').value=saved;
</script></body></html>
